name: HTML CSS Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HTML and CSS validators
        run: npm install --global html-validate stylelint stylelint-config-standard

      - name: Test HTML
        run: html-validate "**/*.html"

      - name: Test CSS
        run: stylelint "**/*.css" --config-basedir /usr/local/lib/node_modules/stylelint-config-standard
